<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog preview card</title>
    </head>
    <body>
        <main>
            <article class="card">
                <header>
                    <img src="images/illustration-article.svg" alt="Abstract Illustration of Coding">
                </header>

                <div class="card__main">
                    <div>Learning</div>
                    <p>Published <time datetime="2023-12-21">21 Dec 2023</time></p>
                    <h1>HTML & CSS foundations</h1>
                    <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
                </div>

                <footer>
                    <img src="images/image-avatar.webp" alt="Greg Hooper's profile at a 3/4 angle, wearing a light blue shirt.">
                    <p>Greg Hooper</p>
                </footer>
            </article>
        </main>
    </body>
</html>
