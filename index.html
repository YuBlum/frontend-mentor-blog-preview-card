<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog preview card</title>

        <link rel="icon" type="image/x-icon" href="images/favicon-32x32.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <article class="card">
                <header>
                    <img src="images/illustration-article.svg" alt="Abstract Illustration of Coding">
                </header>

                <div class="card__main">
                    <span class="category-box">Learning</span>
                    <p class="publishing-date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
                    <h1>HTML & CSS foundations</h1>
                    <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                </div>

                <footer>
                    <img src="images/image-avatar.webp" alt="">
                    <p>Greg Hooper</p>
                </footer>
            </article>
        </main>
    </body>
</html>
